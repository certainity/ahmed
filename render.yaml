services:
  - type: web
    name: kids-drive-cinema
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5174
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1fU3vbnn3tBtONgb9N1kPQ3kM8hRzW0xy
      - key: INCLUDE_SUBFOLDERS
        value: true
      - key: MAX_SCAN_DEPTH
        value: 8
      - key: MAX_FOLDERS
        value: 750
      - key: CACHE_TTL_MS
        value: 300000
      - key: HLS_START_SEGMENTS
        value: 4
      - key: HLS_START_TIMEOUT_MS
        value: 12000
      - key: HLS_BUFFER_TIMEOUT_MS
        value: 8000
      - key: HLS_PREWARM_MAX_ACTIVE
        value: 1
      - key: HLS_PREWARM_MAX_BYTES
        value: 1258291200
      - key: HLS_JOB_START_TIMEOUT_MS
        value: 90000
      - key: ENABLE_HLS_PREWARM
        value: false
      - key: ENABLE_VIDEO_THUMBNAILS
        value: false
      - key: CLIENT_ORIGIN
        value: '*'
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
