services:
  - type: web
    name: drive-movies-cinema
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5174
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1ECrt0eLyv1wGFUfoNc6VMm-vuxblBp-s
      - key: INCLUDE_SUBFOLDERS
        value: true
      - key: MAX_SCAN_DEPTH
        value: 8
      - key: MAX_FOLDERS
        value: 750
      - key: CACHE_TTL_MS
        value: 300000
      - key: CLIENT_ORIGIN
        value: '*'
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
